plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.2'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id + "-fabric-" + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    runs {
        client { client() }
        server { server() }
        datagen {
            inherit getByName("server")

            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources/')}")
            vmArg("-Dfabric-api.datagen.modid=rsinfinitybooster")
        }
    }

    mixin {
        defaultRefmapName = "RSInfinityBooster.refmap.json"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraft:minecraft:26.1.2'

    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2"

    implementation "curse.maven:forge-config-api-port-547434:8218664"

    runtimeOnly "curse.maven:jei-238222:9205179"
    compileOnly "curse.maven:refined-storage-243076:8211385"
    runtimeOnly "curse.maven:refined-storage-243076:8211385"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "rsinfinitybooster",
                //"Specification-Vendor"  : "rsinfinitybooster authors",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                //"Implementation-Vendor" : "rsinfinitybooster authors",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}